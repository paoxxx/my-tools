<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>导出</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
  @page { size: 210mm 297mm; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  .page { position: relative; width: 210mm; height: 297mm; overflow: hidden; break-after: page; page-break-after: always; background: #fff; }
  .page:last-child { break-after: auto; page-break-after: auto; }
  .page svg { position: absolute; left: 0; top: 0; overflow: hidden; }
  .lblock, .mk-layer, .tx-layer { position: absolute; left: 0; top: 0; }
  .mk { position: absolute; }
  .ul { position: absolute; background: #1f1f1d; border-radius: 1px; }
  .ch { position: absolute; text-align: center; white-space: pre; color: #1a1a1a; }
  .ch.b { font-weight: 700; }
  .img { position: absolute; overflow: hidden; }
  .img img { position: absolute; max-width: none; }
  .pnote { position: absolute; white-space: pre; line-height: 1.3; }
  body.shot { overflow: hidden; }
  .wm { position: absolute; pointer-events: none; font-family: 'Noto Sans SC', sans-serif; }
  .wm.corner { right: 8mm; bottom: 5mm; font-size: 12px; color: rgba(0,0,0,.32); letter-spacing: .5px; }
  .wm.tile { inset: 0; overflow: hidden; }
  .wm.tile span { position: absolute; font-size: 18px; color: rgba(0,0,0,.075); white-space: nowrap; transform: rotate(-28deg); transform-origin: left top; }
  .mind { position: absolute; }
  .mind-in { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .mn { position: absolute; box-sizing: border-box; white-space: pre; }
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/perfect-freehand.js"></script>
<script src="js/core.js"></script>
<script src="js/export.js"></script>
</body>
</html>
