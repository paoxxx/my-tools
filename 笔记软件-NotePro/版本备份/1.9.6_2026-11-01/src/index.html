<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Note Pro</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; script-src 'self'">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="vendor/icons/tabler-icons.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="dragzone"></div>
<header id="topbar">
  <div class="tb-left">
    <button class="icon-btn" id="btn-sidebar" title="笔记列表"><i class="ti ti-layout-sidebar"></i></button>
  </div>
  <div class="tb-center">
    <div id="toolpill">
      <div id="tools"></div>
      <div id="options"></div>
    </div>
  </div>
  <div class="tb-right">
    <button class="icon-btn" id="btn-undo" title="撤销 ⌘Z"><i class="ti ti-arrow-back-up"></i></button>
    <button class="icon-btn" id="btn-redo" title="重做 ⇧⌘Z"><i class="ti ti-arrow-forward-up"></i></button>
    <button class="icon-btn" id="btn-export" title="导出（⇧⌘P 按上次的设置直接导出）"><i class="ti ti-file-export"></i></button>
    <button class="icon-btn" id="btn-wechat" title="分享到微信（⌘P）：按导出设置生成文件，放进剪贴板，在微信里 ⌘V"><i class="ti ti-share-2"></i></button>
    <button class="icon-btn" id="btn-more" title="设置"><i class="ti ti-dots"></i></button>
  </div>
</header>
<div id="main">
  <aside id="sidebar">
    <button id="btn-new"><i class="ti ti-plus"></i> 新建笔记</button>
    <div id="notelist"></div>
  </aside>
  <div id="scroller">
    <div id="title" title="双击改名"></div>
    <div id="sizer">
      <div id="paper">
        <div id="pages"></div>
        <div id="textlayer"></div>
        <div id="mindlayer"></div>
        <div id="imglayer"></div>
        <svg id="inklayer" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="overlay"></div>
        <div id="notelayer"></div>
        <div id="uilayer"></div>
      </div>
    </div>
    <div id="addpage-wrap"><button id="btn-addpage"><i class="ti ti-plus"></i> 添加一页</button></div>
  </div>
</div>
<button id="zenbtn" title="展开工具栏（可拖动）"></button>
<div id="toast"></div>
<div id="modal-root"></div>
<script src="vendor/perfect-freehand.js"></script>
<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
