<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>分句录音器</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:; worker-src blob:; img-src 'self' data:">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="prompter">
    <div id="projBar" title="当前工程（点击改名）"><span class="pj-ic">●</span><span id="projTitle"></span><span id="savedAt"></span></div>
    <div class="p-head">
      <button id="btnEdit" title="粘贴或修改逐字稿，一行就是一段">编辑稿子</button>
      <label class="ctl">字号<input type="range" id="fontSize" min="16" max="72" step="1"></label>
      <div class="seg" id="scrollModeSeg">
        <button data-mode="follow" title="录到哪句，哪句高亮居中，像看歌词">跟随</button>
        <button data-mode="scroll" title="匀速自动往上滚，像提词器">匀速</button>
      </div>
      <label class="ctl speed">速度<input type="range" id="scrollSpeed" min="5" max="200" step="1"></label>
      <button id="btnScroll" class="speed" title="开始或暂停匀速滚动">▶ 滚动</button>
    </div>
    <div id="pBody">
      <div id="sentList"></div>
      <textarea id="scriptEdit" spellcheck="false" placeholder="把逐字稿粘贴到这里。&#10;&#10;一行就是一段，按回车分段，每段录一次；&#10;句号不会断开，一整段一口气录完更自然。&#10;&#10;粘贴好之后点上面的“完成”。"></textarea>
    </div>
    <div class="p-foot" id="pFoot"></div>
  </aside>
  <div id="divider"></div>
  <main id="main">
    <div class="bar" id="bar1">
      <button id="btnRec" class="rec" title="录当前段 / 停止（快捷键 R）"><span class="dot"></span><span id="recLabel">录音</span></button>
      <button id="btnPlay" title="播放 / 停止（空格）">▶</button>
      <button id="btnHome" title="回到开头（回车）">⏮</button>
      <span id="timeDisp" class="mono">0:00.00</span>
      <canvas id="liveWave" width="180" height="30" title="实时输入波形"></canvas>
      <div class="meter" title="输入电平，别长时间顶到红色"><div id="meterFill"></div></div>
      <select id="device" title="麦克风"></select>
      <div class="spacer"></div>
      <input id="projName" title="工程名，改名会自动重命名文件夹" spellcheck="false">
      <button id="btnOpen">打开</button>
      <button id="btnNew">新建</button>
      <button id="btnReveal" title="在访达里打开工程文件夹">📁</button>
      <button id="btnExportM4a" class="primary">导出 M4A</button>
      <button id="btnExportWav">导出 WAV</button>
    </div>
    <div class="bar" id="bar2">
      <span class="ctl" title="整段音频的平均响度，媒体平台按这个值统一音量">响度<span id="lufsVal" class="mono val lufs">-- LUFS</span></span>
      <button id="btnMeasure" title="测一下现在整段的响度">测量</button>
      <select id="lufsTarget" title="选目标响度"><option value="-14">-14 短视频/流媒体</option><option value="-16">-16 播客/人声</option><option value="-23">-23 广播电视</option></select>
      <button id="btnUnify" class="primary" title="每段音量拉齐，再把整体调到目标响度，过响的地方由压峰值压住">一键标准响度</button>
      <span class="sep"></span>
      <label class="ctl">默认间隙<input type="number" id="gap" min="0" max="3" step="0.05">秒</label>
      <button id="btnArrange" title="按段落顺序重新排一遍，段与段之间都用默认间隙">重新排列</button>
      <label class="chk" title="拖动或裁剪某一段时，后面的段落一起跟着动（按住 Option 拖动则只动这一段）"><input type="checkbox" id="ripple">后面跟着动</label>
      <label class="chk" title="录完自动把开头结尾的空白和按键声裁掉（可以拖边缘再拉回来）"><input type="checkbox" id="autoTrim">自动去头尾静音</label>
      <span class="sep"></span>
      <label class="ctl" title="每段开头慢慢进来的时长">淡入<input type="number" id="fadeIn" min="0" max="1" step="0.02">秒</label>
      <label class="ctl" title="每段结尾慢慢收掉的时长，长一点尾音更自然">淡出<input type="number" id="fadeOut" min="0" max="1" step="0.02">秒</label>
      <label class="chk" title="段与段之间不留数字静音，用你房间的环境声补上，听起来像一口气录的"><input type="checkbox" id="roomTone">停顿处补环境声</label>
      <span class="sep"></span>
      <label class="ctl">波形放大<input type="range" id="waveZoom" min="1" max="12" step="0.5"></label>
      <label class="ctl">时间缩放<input type="range" id="zoom" min="1.6" max="7.6" step="0.01"></label>
      <span class="sep"></span>
      <span class="ctl gain">片段增益<button class="step" data-for="clip" data-d="-1" title="减1dB">−</button><input type="range" id="clipGain" min="-12" max="30" step="0.5" list="clipTicks" title="每3dB一个定位点，双击回到0dB"><button class="step" data-for="clip" data-d="1" title="加1dB">＋</button><input type="number" id="clipGainNum" class="gnum" min="-12" max="30" step="0.5">dB</span>
      <button id="btnGainAll" title="把选中片段的增益应用到所有片段">应用到全部</button>

      <span class="ctl gain" title="主音量作用于所有片段，包括以后新录的">主音量（全部）<button class="step" data-for="master" data-d="-1" title="减1dB">−</button><input type="range" id="masterGain" min="-24" max="30" step="0.5" list="masterTicks" title="每3dB一个定位点，双击回到0dB"><button class="step" data-for="master" data-d="1" title="加1dB">＋</button><input type="number" id="masterGainNum" class="gnum" min="-24" max="30" step="0.5">dB</span>
      <datalist id="clipTicks"><option value="-12"><option value="-6"><option value="0"><option value="6"><option value="12"><option value="18"><option value="24"><option value="30"></datalist>
      <datalist id="masterTicks"><option value="-24"><option value="-18"><option value="-12"><option value="-6"><option value="0"><option value="6"><option value="12"><option value="18"><option value="24"></datalist>
    </div>
    <div class="bar" id="bar3">
      <button id="btnBreathSample" class="hot" title="先按住 Shift 在波形上拖出一段吸气声，再点这里：这一处一定会被处理，同时记成样本，以后自动认（快捷键 B）">标记吸气 B</button>
      <button id="btnNotBreath" title="选中的地方不是吸气（认错了的说话声），取消处理（快捷键 N）">不是吸气 N</button>
      <button id="btnUndoMark" class="warn" title="撤回上一次标记，连同它记下的样本一起删掉，可以连续撤回（快捷键 U）">↶ 撤回标记 U</button>
      <button id="btnBreathClear" title="清掉所有吸气样本，改回自动识别">清除样本</button>
      <label class="chk" title="处理认出来的吸气声（紫色），原录音不动，随时能关"><input type="checkbox" id="breathOn">处理吸气</label>
      <select id="breathMode" title="静音：吸气处整段去掉，只留房间环境声；压低：按dB压低"><option value="mute">静音</option><option value="duck">压低</option></select>
      <label class="ctl" id="breathDbWrap"><input type="number" id="breathDb" min="3" max="60" step="1">dB</label>
      <span id="breathInfo" class="mono val"></span>
      <span class="sep"></span>
      <label class="ctl" title="去掉持续的底噪（嘶嘶声、电流声）。0 是关闭，30 左右比较自然，太大会有“水声”">降噪<input type="range" id="denoise" min="0" max="100" step="5"><span id="denoiseVal" class="mono val">0%</span></label>
      <label class="chk" title="说话特别响的地方自动压下去一点，让整段音量更平均"><input type="checkbox" id="leveler">动态均衡</label>
      <label class="chk" title="任何地方都不超过 -1dB，统一音量后不会爆音"><input type="checkbox" id="limiter">压峰值</label>
    </div>
    <div id="timelineWrap"><canvas id="tl"></canvas>
      <div id="selPop"><button id="popMark" class="hot">标记吸气 B</button><button id="popNot">不是吸气 N</button><button id="popPlay">试听 P</button><button id="popZoom">放大 Z</button><button id="popClose" title="取消选区 Esc">✕</button></div>
    </div>
    <div id="statusBar"><span id="status">准备就绪</span><span id="keys">⌘N 新建工程 · R 录音/停止 · Esc 取消 · 空格 播放 · Shift+拖动 选区（拖边缘可调）· B 标记吸气 · N 不是吸气 · U 撤回标记 · Z 放大选区 · P 试听当前段/选区 · ↑↓ 切段 · ⌫ 删片段 · ⌘Z 撤销 · 双指捏合 缩放</span></div>
  </main>
</div>

<div id="modal" class="hidden">
  <div class="modal-box">
    <h3>打开工程</h3>
    <div id="projList"></div>
    <div class="modal-foot"><button id="modalClose">关闭</button></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
